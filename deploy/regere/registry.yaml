- name: message-flow
  display_name: Message Flow
  description: Notifications over email, web push and realtime
  category: platform
  tags:
  - rust
  - platform
  - notifications
  versions:
  - version: 1.0.2+spec.1
    image: ghcr.io/regere-ai/message-flow:1.0.2
    release_notes: 'Image 1.0.2. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 8080
      name: http
    - container: 9090
      name: admin
    needs:
    - name: assets
      kind: bucket
      api: s3
    env:
    - name: MF_MODE
      default: all
    - name: DB_NAME
      default: message_flow
      description: Database in the workload's postgres; create-service-dbs creates it
    - name: DB_USER
      default: message_flow_app
    - name: DB_PASSWORD
      secret: true
      generate: password
    - name: MF_DATABASE__URL
      secret: true
      from: template:postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{env.DB_NAME}}
    - name: MF_QUEUE__BACKEND
      default: none
      description: none = DB polling only; rabbitmq uses MF_QUEUE__RABBITMQ__URL
    - name: MF_QUEUE__RABBITMQ__URL
      secret: true
      from: template:amqp://{{service:rabbitmq.env.RABBITMQ_DEFAULT_USER}}:{{service:rabbitmq.env.RABBITMQ_DEFAULT_PASS}}@{{service:rabbitmq.host}}:{{service:rabbitmq.port}}/%2F
    - name: MF_STORAGE__PROVIDER
      default: s3
    - name: MF_STORAGE__BUCKET
      from: resource:assets.name
    - name: MF_STORAGE__REGION
      from: resource:assets.region
    - name: MF_STORAGE__ACCESS_KEY_ID
      secret: true
      from: resource:assets.access_key_id
    - name: MF_STORAGE__SECRET_ACCESS_KEY
      secret: true
      from: resource:assets.secret_access_key
    - name: AWS_ENDPOINT_URL_S3
      from: resource:assets.endpoint
      description: Unset on AWS; set for an S3-compatible backend
    - name: MF_CHANNELS__EMAIL__ENABLED
      default: 'true'
      enum: *id001
    - name: MF_CHANNELS__EMAIL__HOST
      default: smtp.zeptomail.in
    - name: MF_CHANNELS__EMAIL__PORT
      default: '587'
    - name: MF_CHANNELS__EMAIL__USERNAME
      default: emailapikey
    - name: MF_CHANNELS__EMAIL__PASSWORD
      required: true
      secret: true
    - name: MF_CHANNELS__EMAIL__FROM_ADDRESS
      default: noreply@regere.ai
    - name: MF_CHANNELS__EMAIL__FROM_NAME
      default: Message Flow
    - name: MF_CHANNELS__EMAIL__TLS
      default: starttls
    - name: RUST_LOG
      default: message_flow=debug
    - name: MF_GATEWAY__SUBSCRIBER_HEADER
      default: x-user-id
    - name: MF_REALTIME__ENABLED
      default: 'true'
      enum: *id001
    - name: MF_REALTIME__API_URL
      from: service:sockudo.internal_url
    - name: MF_REALTIME__PUBLIC_PATH
      default: rt
    - name: MF_REALTIME__APP_ID
      from: service:sockudo.env.SOCKUDO_DEFAULT_APP_ID
    - name: MF_REALTIME__KEY
      secret: true
      from: service:sockudo.env.SOCKUDO_DEFAULT_APP_KEY
    - name: MF_REALTIME__SECRET
      secret: true
      from: service:sockudo.env.SOCKUDO_DEFAULT_APP_SECRET
    - name: MF_CHANNELS__PUSH__VAPID_PRIVATE_KEY
      required: true
      secret: true
      description: Generate once with `message-flow gen-vapid`
    - name: MF_CHANNELS__PUSH__VAPID_PUBLIC_KEY
      required: true
    - name: MF_CHANNELS__PUSH__VAPID_SUBJECT
      default: mailto:noreply@regere.ai
    depends_on:
    - postgres@latest
    - sockudo@latest
- name: platform-gw
  display_name: Platform Gateway
  description: API gateway and AI gateway in front of the platform services
  category: platform
  tags:
  - rust
  - gateway
  - ai
  versions:
  - version: 0.0.0+spec.1
    image: ghcr.io/regere-ai/platform-gw:latest
    release_notes: 'Floating tag `latest`. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 8080
      name: proxy
    - container: 8081
      name: ai
    - container: 9090
      name: admin
    env:
    - name: GW_MODE
      default: all
      enum:
      - proxy
      - ai
      - admin
      - all
    - name: GW_ENV
      default: production
    - name: DB_NAME
      default: platform_gw
      description: Database in the workload's postgres; create-service-dbs creates it
    - name: DB_USER
      default: platform_gw_app
    - name: DB_PASSWORD
      secret: true
      generate: password
    - name: GW_DATABASE__URL
      secret: true
      from: template:postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{env.DB_NAME}}
    - name: GW_SECURITY__ENCRYPTION_KEY
      secret: true
      generate: base64-32
      description: Set once; changing it invalidates enrolled authenticators
    - name: GW_SECURITY__KEY_PEPPER
      secret: true
      generate: base64-32
      description: Set once; changing it invalidates every API key
    - name: GW_ADMIN_EMAIL
      default: tech@regere.ai
      description: Bootstrap admin, read only while admin_users is empty
    - name: GW_ADMIN_PASSWORD
      secret: true
      generate: password
    - name: GW_AI__DEFAULT_MAX_TOKENS
      default: '4096'
    - name: RUST_LOG
      default: info
    depends_on:
    - postgres@latest
- name: sockudo
  display_name: Sockudo
  description: Pusher-compatible realtime WebSocket server
  category: platform
  tags:
  - rust
  - realtime
  - websocket
  versions:
  - version: 0.0.0+spec.1
    image: godson326/sockudo:latest
    release_notes: 'Floating tag `latest`. Configured by env (the image reads /app/config/config.json, not a mounted config.toml). Spec revision 1: databases, URLs and keys come from templates, links, resources
      and generated secrets instead of pasted values.'
    ports:
    - container: 6002
      name: http
    env:
    - name: RUST_LOG
      default: info
    - name: PORT
      default: '6002'
    - name: SOCKUDO_DEFAULT_APP_ID
      default: notifications
    - name: SOCKUDO_DEFAULT_APP_KEY
      secret: true
      generate: password
      description: message-flow reads it from here
    - name: SOCKUDO_DEFAULT_APP_SECRET
      secret: true
      generate: password
      description: message-flow reads it from here
    - name: SOCKUDO_DEFAULT_APP_ENABLE_CLIENT_MESSAGES
      default: 'false'
      enum: *id001
      description: Backend-only publishing
    - name: SOCKUDO_DEFAULT_APP_ALLOWED_ORIGINS
      description: Origins browsers may connect from; set it to the UI's origin (unset allows any)
    - name: SOCKUDO_DEFAULT_APP_MAX_CONNECTIONS
      default: '20000'
    - name: SOCKUDO_DEFAULT_APP_MAX_CLIENT_EVENTS_PER_SECOND
      default: '100'
    healthcheck:
      command:
      - curl
      - -f
      - http://127.0.0.1:6002/up
      interval: 15s
      timeout: 5s
      retries: 5
- name: simulation-service
  display_name: Simulation Service
  description: Simulation API; queues jobs on SQS for the simulation workers
  category: platform
  tags:
  - python
  - platform
  - simulation
  versions:
  - version: 0.0.0+spec.1
    image: ghcr.io/regere-ai/simulation-service-v2:latest
    release_notes: 'Floating tag `latest`. Owns the bucket and queue its workers share. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted
      values.'
    ports:
    - container: 8005
      name: http
    needs:
    - name: assets
      kind: bucket
      api: s3
    - name: jobs
      kind: queue
      api: sqs
      options:
        visibility_timeout: 300
        dead_letter:
          max_receive: 10
    env:
    - &id002
      name: PORT
      default: '8005'
    - &id003
      name: STORAGE_PROVIDER
      default: s3
    - &id004
      name: STORAGE_BUCKET
      from: resource:assets.name
    - &id005
      name: SQS_QUEUE_URL
      from: resource:jobs.url
    - &id006
      name: AWS_REGION
      from: resource:jobs.region
    - &id007
      name: AWS_ACCESS_KEY_ID
      secret: true
      from: resource:jobs.access_key_id
    - &id008
      name: AWS_SECRET_ACCESS_KEY
      secret: true
      from: resource:jobs.secret_access_key
    - name: AWS_ENDPOINT_URL_S3
      from: resource:assets.endpoint
      description: Unset on AWS; set for an S3-compatible backend
    - &id009
      name: AWS_ENDPOINT_URL_SQS
      from: resource:jobs.endpoint
      description: Unset on AWS; set for an SQS-compatible backend
    - &id010
      name: S3_PRESIGNED_URL_EXPIRES_IN
      default: '3600'
    - &id011
      name: SQS_WAIT_TIME_SECONDS
      default: '10'
    - &id012
      name: SQS_VISIBILITY_TIMEOUT_SECONDS
      default: '300'
    - &id013
      name: WORKER_IDLE_SLEEP_SECONDS
      default: '1'
    - &id014
      name: WORKER_DELETE_FAILED_MESSAGE
      default: 'false'
      enum: *id001
    - name: DB_NAME
      default: simulation
      description: Database in the workload's postgres; create-service-dbs creates it
    - name: DB_USER
      default: simulation_app
    - name: DB_PASSWORD
      secret: true
      generate: password
    - name: DATABASE_URL
      secret: true
      from: template:postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{env.DB_NAME}}
    depends_on:
    - postgres@latest
- name: simulation-worker
  display_name: Simulation Worker
  description: SQS worker for simulation-service; needs the same env as simulation-service
  category: platform
  tags:
  - python
  - platform
  - simulation
  - worker
  versions:
  - version: 0.0.0+spec.1
    image: ghcr.io/regere-ai/simulation-service-v2-worker-1:latest
    release_notes: 'Floating tag `latest`. Three replicas on simulation-service''s queue and database. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets
      instead of pasted values.'
    command:
    - python
    - /app/worker.py
    replicas: 3
    needs:
    - name: assets
      use: simulation-service.assets
    - name: jobs
      use: simulation-service.jobs
    env:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - name: AWS_ENDPOINT_URL_S3
      from: resource:assets.endpoint
      description: Unset on AWS; set for an S3-compatible backend
    - *id009
    - *id010
    - *id011
    - *id012
    - *id013
    - *id014
    - name: DATABASE_URL
      secret: true
      from: template:postgresql://{{service:simulation-service.env.DB_USER}}:{{service:simulation-service.env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{service:simulation-service.env.DB_NAME}}
    depends_on:
    - postgres@latest
    - simulation-service@latest
- name: postgres
  display_name: PostgreSQL
  description: Relational database
  category: data
  tags:
  - sql
  - database
  homepage: https://www.postgresql.org
  versions:
  - version: 18.4.0+spec.1
    image: postgres:18.4-alpine
    release_notes: The superuser password is generated.
    ports:
    - container: 5432
      name: postgres
    env:
    - name: POSTGRES_USER
      default: postgres
    - name: POSTGRES_PASSWORD
      secret: true
      generate: password
      description: Superuser password
    - name: POSTGRES_DB
      default: postgres
    volumes:
    - name: data
      path: /var/lib/postgresql
    healthcheck:
      command:
      - pg_isready
      - -U
      - postgres
      interval: 5s
      timeout: 5s
      retries: 5
- name: rabbitmq
  display_name: RabbitMQ
  description: Message broker with the management UI
  category: data
  tags:
  - queue
  - amqp
  homepage: https://www.rabbitmq.com
  versions:
  - version: 3.12.9+spec.1
    image: rabbitmq:3.12.9-management
    release_notes: The default user's password is generated.
    ports:
    - container: 5672
      name: amqp
    - container: 15672
      name: management
    env:
    - name: RABBITMQ_DEFAULT_USER
      default: guest
    - name: RABBITMQ_DEFAULT_PASS
      secret: true
      generate: password
    volumes:
    - name: data
      path: /var/lib/rabbitmq
    healthcheck:
      command:
      - rabbitmq-diagnostics
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
