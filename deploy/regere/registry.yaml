# New registry versions for the regere app + platform workloads (spec revision 1).
# Import with `ikit registry import deploy/regere/registry.yaml`; existing versions stay.
services:
- name: authrs
  display_name: Authrs
  description: Multi-tenant auth service
  category: app
  tags:
  - rust
  - auth
  versions:
  - version: 0.1.11
    image: docker.io/kaushik91/authrs:v0.1.11
    release_notes: 'Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 3000
      name: http
    env:
    - name: DB_NAME
      default: authrs
      description: Database in the workload's postgres; create-service-dbs creates it
    - name: DB_USER
      default: authrs_app
    - name: DB_PASSWORD
      secret: true
      generate: password
    - name: DATABASE_URL
      secret: true
      from: template:postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{env.DB_NAME}}
    - name: REDIS_URL
      from: template:redis://{{service:redis.host}}:{{service:redis.port}}
    - name: REDIS_ENABLED
      default: 'true'
      enum: &id001
      - 'true'
      - 'false'
    - name: RUST_LOG
      default: authrs=debug
    - name: KV_STORE_ENCRYPTION_KEY
      secret: true
      generate: base64-32
      description: 32 bytes, base64. Set once; changing it makes stored values unreadable
    - name: SMTP_HOST
      default: smtp.zeptomail.in
    - name: SMTP_PORT
      default: '587'
    - name: SMTP_SECURE
      default: 'false'
      enum: *id001
      description: true for port 465
    - name: SMTP_USER
      default: emailapikey
    - name: SMTP_PASS
      required: true
      secret: true
    - name: SMTP_FROM
      default: noreply@regere.ai
    - name: FRONTEND_URL
      required: true
      description: Public URL of the UI, e.g. https://<host>/ui/app1
    - name: DEFAULT_SESSION_TTL_SECS
      default: '288000'
    - name: BUILDER_TENANT_ID
      default: builder
    - name: ALLOWED_ROLES
      default: builder_developer_admin,builder_implementor_admin,developer,implementor,architect
    - name: SEED_ADMIN_EMAIL
      default: tech@regere.ai
      description: Admin the seed-app script creates in each tenant
    - name: SEED_ADMIN_PASSWORD
      secret: true
      generate: password
      description: Read by the seed-app script; authrs itself ignores it
    depends_on:
    - postgres@latest
    - redis@latest
- name: core
  display_name: Core
  description: Core API on the service-kit image
  category: app
  tags:
  - rust
  - api
  - service-kit
  versions:
  - version: 0.0.0+spec.1
    image: docker.io/kaushik91/service-kit:latest
    release_notes: 'Floating tag `latest`. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 5000
      name: http
    needs:
    - name: assets
      kind: bucket
      api: s3
    env:
    - name: AUTHRS_URL
      from: service:authrs.internal_url
    - name: SERVICE_NAME
      default: core
    - name: DB_NAME
      default: core
      description: Database in the workload's postgres; create-service-dbs creates it
    - name: DB_USER
      default: core_app
    - name: DB_PASSWORD
      secret: true
      generate: password
    - name: DATABASE_URL
      secret: true
      from: template:postgresql://{{env.DB_USER}}:{{env.DB_PASSWORD}}@{{service:postgres.host}}:{{service:postgres.port}}/{{env.DB_NAME}}
    - name: REDIS_URL
      from: template:redis://{{service:redis.host}}:{{service:redis.port}}
    - name: REDIS_ENABLED
      default: 'true'
      enum: *id001
    - name: RUST_LOG
      default: service_kit=debug,architect_sdk=debug
      description: Tracing target is service_kit (underscore)
    - name: PORT
      default: '5000'
    - name: STORAGE_PROVIDER
      default: s3
    - name: STORAGE_BUCKET
      from: resource:assets.name
    - name: AWS_REGION
      from: resource:assets.region
    - name: AWS_ACCESS_KEY_ID
      secret: true
      from: resource:assets.access_key_id
    - name: AWS_SECRET_ACCESS_KEY
      secret: true
      from: resource:assets.secret_access_key
    - name: AWS_ENDPOINT_URL_S3
      from: resource:assets.endpoint
      description: Unset on AWS; set for an S3-compatible backend
    - name: DECISION_HUB_URL
      from: service:decision-hub.internal_url
      description: decision-hub of the linked platform workload
    - name: DECISION_HUB_LOG_CURL
      default: '1'
    - name: DECISION_HUB_TIMEOUT_SECS
      default: '150'
      description: Seconds core waits on decision-hub /evaluate; keep >= the longest rule timeout_secs (the SDK default of 5 drops long workflow runs)
    - name: ARCHITECT_BULK_LIMIT
      default: '200'
    - name: ARCHITECT_PLATFORM_TENANT
      default: builder
    - name: WORKFLOW_ENGINE_URL
      from: service:workflow-engine.internal_url
    - name: WORKFLOW_ENGINE_TIMEOUT_MS
      default: '120000'
    - name: JOBQ_LEASE_SECONDS
      default: '180'
      description: Must be >= WORKFLOW_ENGINE_TIMEOUT_MS/1000
    - name: DB_MAX_CONNECTIONS
      default: '20'
    depends_on:
    - postgres@latest
    - redis@latest
    - authrs@latest
    - workflow-engine@latest
- name: launchpad
  display_name: Launchpad
  category: app
  tags:
  - rust
  - api
  versions:
  - version: 0.0.0+spec.1
