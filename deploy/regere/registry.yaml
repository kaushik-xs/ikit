- name: client-ui-next
  display_name: Client UI (Next.js)
  category: app
  tags:
  - nextjs
  - ui
  versions:
  - version: 0.0.0+spec.1
    image: ghcr.io/regere-ai/client-ui-next:staging-latest
    release_notes: 'Floating tag `staging-latest`. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 3000
      name: http
    env:
    - name: NEXT_PUBLIC_LAUNCHPAD_API_URL
      required: true
      description: Launchpad's public URL, as the browser sees it
    - name: LAUNCHPAD_API_URL
      from: template:{{service:launchpad.internal_url}}/
    - name: TENANT
      required: true
    - name: NEXT_PUBLIC_LOG_LEVEL
      default: debug
    - name: NODE_ENV
      default: production
    - name: APP_BASE_PATH
      default: /ui/app1
    - name: NEXT_PUBLIC_COMPANY_LOGO
    - name: NEXT_PUBLIC_EMAIL_PASSWORD_LOGIN_ENABLED
      default: 'true'
      enum: *id001
    - name: NEXT_PUBLIC_USERNAME_PASSWORD_LOGIN_ENABLED
      default: 'true'
      enum: *id001
    - name: NEXT_PUBLIC_MICROSOFT_LOGIN_ENABLED
      default: 'true'
      enum: *id001
    - name: NEXT_PUBLIC_LOGIN_BACKGROUND_IMAGE_URL
    - name: NEXT_PUBLIC_SIMULATION_API_BASE_URL
      description: Public URL of launchpad's /proxy/simulation
    - name: COMMON_SERVICES_URL
      from: service:common-services.internal_url
      description: common-services of the linked platform workload
    - name: NEXT_PUBLIC_COMMON_SERVICES_BASE_URL
      default: /proxy/common-services/common-services
