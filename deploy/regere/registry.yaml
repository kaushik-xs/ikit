    release_notes: 'Floating tag `latest`. Spec revision 1: databases, URLs and keys come from templates, links, resources and generated secrets instead of pasted values.'
    ports:
    - container: 80
      name: http
    shm_size: 2gb
    needs:
    - name: assets
      kind: bucket
      api: s3
    env:
    - name: PORT
      default: '80'
    - name: SERVICE_CODE
      default: common-services
    - name: SMTP_FROM
      default: noreply@regere.ai
    - name: SMTP_HOST
      default: smtp.zeptomail.in
    - name: SMTP_PORT
      default: '587'
    - name: SMTP_USER
      default: emailapikey
    - name: SMTP_PASS
      required: true
      secret: true
    - name: STORAGE_PROVIDER
      default: s3
    - name: STORAGE_BUCKET
      from: resource:assets.name
    - name: AWS_REGION
      from: resource:assets.region
    - name: AWS_ACCESS_KEY_ID
      secret: true
      from: resource:assets.access_key_id
    - name: AWS_SECRET_ACCESS_KEY
      secret: true
      from: resource:assets.secret_access_key
    - name: AWS_ENDPOINT_URL_S3
      from: resource:assets.endpoint
      description: Unset on AWS; set for an S3-compatible backend
    - name: STORAGE_ACCESS_KEY
      secret: true
      from: resource:assets.access_key_id
    - name: STORAGE_SECRET_KEY
      secret: true
      from: resource:assets.secret_access_key
    - name: MAX_FILE_SIZE_LIMIT
      default: '10485760'
    - name: ALLOW_SELF_SIGNED
      default: 'true'
